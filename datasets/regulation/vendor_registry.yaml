# Domain patterns mapped to vendor, role, country and category.
#
# Pattern rules: a pattern matches a host that equals it or ends with "." plus the pattern.
# The first matching entry in file order wins, so list more specific patterns first.
# Entries marked fictional use the reserved ".example" suffix and exist only in the
# demonstration estate. Real vendor entries record public facts (name, headquarters
# country) for realistic discovery; they do not claim certification status.

vendors:
  # --- Payments ---
  - {pattern: js.stripe.com, vendor: Stripe, role: processor, country: US, category: payments}
  - {pattern: api.stripe.com, vendor: Stripe, role: processor, country: US, category: payments}
  - {pattern: stripe.com, vendor: Stripe, role: processor, country: US, category: payments}
  - {pattern: paypal.com, vendor: PayPal, role: controller, country: US, category: payments}


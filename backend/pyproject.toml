[project]
name = "processledger-backend"
version = "0.1.0"
description = "ProcessLedger privacy operations platform: backend API and workers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.32",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.2",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.15.1",
    "slowapi>=0.1.10",
    "cryptography>=50.0.2",
    "python-multipart>=0.0.32",
    "sentence-transformers>=3.0",
    "pdfplumber>=0.11.10",
]

[dependency-groups]
datasets = [
    "beautifulsoup4>=4.15.0",
    "faker>=40.43.0",
    "pyyaml>=6.0.3",
]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.6",
    "black>=24.8",
    "mypy>=1.11",
    "bandit>=1.7",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
package = false
default-groups = ["dev", "datasets"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM"]
ignore = ["E501"]  # line length is enforced by black

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form", "app.api.deps.require_role"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S607", "S608", "SIM117", "B008", "E501", "UP031"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -p tests.fixtures_api -p tests.fixtures_classify -p tests.fixtures_knowledge"
